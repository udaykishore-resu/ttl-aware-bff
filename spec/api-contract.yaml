    ErrSchemaMismatch:
      summary: Unsupported source schema version (REQ-EDGE-017)
      description: |
        Note the source states: both breakers are **HEALTHY**. A schema mismatch
        deliberately does not trip a circuit breaker — the source is up, fast and
        answering correctly, and it is the BFF that does not understand the
        contract. Tripping the breaker would reroute every request to the slower
        source and replace a specific version-incompatibility alert with a vague
        availability one.

        `errs.SourceUnusable` is nonetheless true for this code, so a request
        type with a configured fallback takes the call-time fallback and returns
        `200` degraded instead of this document. This `502` is what the endpoints
        with `fallback: none` return.
      value:
