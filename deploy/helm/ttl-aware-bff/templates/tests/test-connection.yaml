{{- if .Values.tests.enabled }}
{{/*
Helm test pod: `helm test <release>`.

Runs after install/upgrade and exercises the paths that prove the release is
actually wired up, not merely scheduled:

  1. /livez and /readyz on the admin port  — the pod is serving
  2. /metrics carries the contract's instruments — telemetry is registered
  3. the public API port answers on 8080  — the Service routes correctly

The test does NOT assert on business data: the BFF's upstreams may legitimately
be empty in a fresh environment, and a test that fails for that reason is a
test people learn to ignore.

hook-delete-policy keeps a FAILED pod around for `kubectl logs`, which is the
only time its logs are worth anything.
*/}}
apiVersion: v1
kind: Pod
metadata:
  name: {{ printf "%s-test-connection" (include "ttl-aware-bff.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ttl-aware-bff.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-weight: "1"
    helm.sh/hook-delete-policy: {{ if .Values.tests.deleteOnSuccess }}hook-succeeded,before-hook-creation{{ else }}before-hook-creation{{ end }}
spec:
  restartPolicy: Never
  # The namespace enforces the `restricted` Pod Security Standard, so the test
  # pod has to satisfy it too.
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    runAsGroup: 65532
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: test
      image: "{{ .Values.tests.image.repository }}:{{ .Values.tests.image.tag }}"
      imagePullPolicy: {{ .Values.tests.image.pullPolicy }}
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          memory: 64Mi
      command: ["/bin/sh", "-e", "-c"]
      args:
        - |
          SVC="{{ include "ttl-aware-bff.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local"
          ADMIN="http://${SVC}:{{ .Values.service.adminPort }}"
          API="http://${SVC}:{{ .Values.service.httpPort }}"

          echo "==> target service: ${SVC}"

          # --- 1. liveness -------------------------------------------------
          echo "==> GET ${ADMIN}/livez"
          curl --fail --silent --show-error --max-time 10 "${ADMIN}/livez" > /dev/null
          echo "    ok"

          # --- 2. readiness ------------------------------------------------
          # Retry: a rollout may still be settling when the hook fires.
          echo "==> GET ${ADMIN}/readyz"
          curl --fail --silent --show-error --max-time 10 \
               --retry 12 --retry-delay 5 --retry-connrefused \
               "${ADMIN}/readyz" > /dev/null
          echo "    ok"

          # --- 3. metrics --------------------------------------------------
          # Assert a contract instrument is present (design contract §7). This
          # catches a build where the meter provider failed to register, which
          # readiness alone would not.
          echo "==> GET ${ADMIN}/metrics"
          METRICS="$(curl --fail --silent --show-error --max-time 10 "${ADMIN}/metrics")"
          echo "${METRICS}" | grep -q 'bff_request_total' \
            || { echo "FAIL: bff_request_total missing from /metrics"; exit 1; }
          echo "${METRICS}" | grep -q 'bff_concurrent_requests' \
            || { echo "FAIL: bff_concurrent_requests missing from /metrics"; exit 1; }
          echo "    ok (contract instruments registered)"

          # --- 4. public API port ------------------------------------------
          # An unauthenticated request must be REFUSED, not ignored: 401 or 403
          # proves the router and the auth middleware are both wired up. A 000
          # (connection failure) or a 5xx is a failure.
          echo "==> GET ${API}/api/v1/resources/helm-test-probe"
          CODE="$(curl --silent --output /dev/null --max-time 10 \
                   --write-out '%{http_code}' \
                   "${API}/api/v1/resources/helm-test-probe")"
          echo "    HTTP ${CODE}"
          case "${CODE}" in
            401|403|404|200) echo "    ok (API port routed)" ;;
            *) echo "FAIL: unexpected status ${CODE} from the API port"; exit 1 ;;
          esac

          echo "==> all checks passed"
{{- end }}
