{{- if and .Values.secrets.create (not .Values.secrets.existingSecret) }}
{{/*
Chart-managed Secret.

Only rendered when secrets.create is true AND no existing Secret is named.
Values placed here end up in the release's stored manifest, which is readable
by anyone with `helm get manifest` rights — so this path is for development
only. Production supplies secrets.existingSecret, reconciled from AWS Secrets
Manager by External Secrets or decrypted by the sealed-secrets controller.
See deploy/k8s/secret.example.yaml for both.

Keys are the environment-variable NAMES that config points at:
  BFF_REDIS_PASSWORD    <- cache.redis.password_env
  BFF_JWT_HS256_SECRET  <- security.jwt.hs256_secret_env
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-secrets" (include "ttl-aware-bff.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ttl-aware-bff.labels" . | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.data }}
  {{- if $value }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
{{- end }}
