{{- if .Values.serviceAccount.create }}
{{/*
ServiceAccount for the BFF pods.

On EKS this is the identity half of IRSA: the pod identity webhook sees the
eks.amazonaws.com/role-arn annotation, projects a signed service-account token
into the pod, and the AWS SDK exchanges it for temporary credentials. The role
and its trust policy — which pins it to
system:serviceaccount:<namespace>:<name> — come from
deploy/terraform/modules/iam.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "ttl-aware-bff.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ttl-aware-bff.labels" . | nindent 4 }}
  annotations:
    {{- with .Values.serviceAccount.roleArn }}
    eks.amazonaws.com/role-arn: {{ . | quote }}
    {{- end }}
    {{- if .Values.serviceAccount.roleArn }}
    # Regional STS: the global endpoint adds cross-region latency to every
    # credential refresh and is a single point of failure.
    eks.amazonaws.com/sts-regional-endpoints: "true"
    eks.amazonaws.com/token-expiration: "3600"
    {{- end }}
    {{- with .Values.commonAnnotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{/*
The BFF never calls the Kubernetes API, so the default API token is not
projected. IRSA's token is a separate projected volume added by the webhook and
is unaffected by this.
*/}}
automountServiceAccountToken: {{ .Values.serviceAccount.automountServiceAccountToken }}
{{- end }}
