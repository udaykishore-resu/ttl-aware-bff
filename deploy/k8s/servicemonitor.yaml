# ServiceMonitor — tells the Prometheus Operator to scrape the BFF.
#
# Requires the monitoring.coreos.com CRDs (kube-prometheus-stack). If the
# cluster uses AMP via the ADOT collector instead, this object is unused and the
# collector's own scrape config takes its place.
#
# Scrape target is the ADMIN port (9090), never the public API port. The
# NetworkPolicy in networkpolicy.yaml permits exactly this flow from the
# monitoring/observability namespaces.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ttl-aware-bff
  namespace: bff
  labels:
    app.kubernetes.io/name: ttl-aware-bff
    app.kubernetes.io/instance: ttl-aware-bff
    app.kubernetes.io/component: bff
    app.kubernetes.io/part-of: ttl-aware-bff
    app.kubernetes.io/managed-by: kustomize
    # kube-prometheus-stack only adopts ServiceMonitors carrying its release
    # label. Set this to the actual Prometheus release name in the cluster or
    # the object is created and silently ignored.
    release: kube-prometheus-stack
spec:
  namespaceSelector:
    matchNames:
      - bff
  selector:
    matchLabels:
      app.kubernetes.io/name: ttl-aware-bff
      app.kubernetes.io/instance: ttl-aware-bff
      app.kubernetes.io/component: bff
  endpoints:
    - port: admin           # named port from service.yaml
      path: /metrics
      scheme: http
      # 15s matches observability.metrics_interval in bff.yaml, so Prometheus
      # never samples the same OTel export window twice.
      interval: 15s
      scrapeTimeout: 10s
      honorLabels: false
      # Exemplars carry trace_id, which is what makes the Grafana
      # latency-histogram-to-trace jump work.
      honorTimestamps: true

      metricRelabelings:
        # Drop the Go runtime and process collectors. They are useful when
        # debugging a specific pod but multiply cardinality across a 30-replica
        # fleet, and node_exporter/cAdvisor already cover the same ground.
        - sourceLabels: [__name__]
          regex: "go_.*|process_.*|promhttp_.*"
          action: drop

        # Guard against unbounded cardinality on tenant_id. A per-tenant label
        # is exactly what makes these metrics useful (design contract §7), but
        # a bug that puts a request id there would take Prometheus down. Cap the
        # length and let anything absurd fall into an `overflow` bucket.
        - sourceLabels: [tenant_id]
          regex: "(.{1,64})"
          targetLabel: tenant_id
          replacement: "$1"
          action: replace
        - sourceLabels: [tenant_id]
          regex: ".{65,}"
          targetLabel: tenant_id
          replacement: "overflow"
          action: replace

      relabelings:
        # Promote pod/node identity so a single misbehaving replica can be
        # isolated from a dashboard.
        - sourceLabels: [__meta_kubernetes_pod_name]
          targetLabel: pod
          action: replace
        - sourceLabels: [__meta_kubernetes_pod_node_name]
          targetLabel: node
          action: replace
        - sourceLabels: [__meta_kubernetes_namespace]
          targetLabel: namespace
          action: replace
        - sourceLabels: [__meta_kubernetes_pod_label_app_kubernetes_io_version]
          targetLabel: version
          action: replace
