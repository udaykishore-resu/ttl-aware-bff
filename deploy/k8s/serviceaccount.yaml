# ServiceAccount for the BFF pods.
#
# On EKS this is the identity half of IRSA (IAM Roles for Service Accounts):
# the EKS pod identity webhook sees the eks.amazonaws.com/role-arn annotation,
# projects a signed service-account token into the pod, and the AWS SDK
# exchanges it for temporary credentials for that role. The role itself, and
# the trust policy that pins it to `system:serviceaccount:bff:ttl-aware-bff`,
# are created by deploy/terraform/modules/iam.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ttl-aware-bff
  namespace: bff
  labels:
    app.kubernetes.io/name: ttl-aware-bff
    app.kubernetes.io/instance: ttl-aware-bff
    app.kubernetes.io/component: bff
    app.kubernetes.io/part-of: ttl-aware-bff
    app.kubernetes.io/managed-by: kustomize
  annotations:
    # Replaced per environment by the kustomize overlays (overlays/dev,
    # overlays/prod) or by `helm --set serviceAccount.roleArn=...`. The account
    # id below is the documented placeholder; Terraform emits the real value as
    # the `bff_irsa_role_arn` output.
    eks.amazonaws.com/role-arn: "arn:aws:iam::000000000000:role/ttl-aware-bff-irsa"
    # Force the regional STS endpoint. The global endpoint adds cross-region
    # latency to every credential refresh and is a single point of failure.
    eks.amazonaws.com/sts-regional-endpoints: "true"
    # 1 hour; the SDK refreshes well before expiry.
    eks.amazonaws.com/token-expiration: "3600"

# The BFF talks to Redis, the two data sources and the collector. It never calls
# the Kubernetes API, so the default API token is not projected. IRSA's own
# token is a separate projected volume added by the webhook and is unaffected.
automountServiceAccountToken: false
