# Secrets for the BFF — EXAMPLE ONLY.
#
# This file is committed as documentation of the secret *shape*. It must never
# hold a real value. Two production-safe delivery mechanisms are shown; pick
# one per cluster and delete the other.
#
# The BFF never reads a secret path from config. Config carries the NAME of the
# environment variable holding the credential (`cache.redis.password_env`,
# `security.jwt.hs256_secret_env`), and the value arrives as an env var from
# one of the Secrets below. That indirection is what lets the ConfigMap stay
# plaintext and reviewable.
#
# Keys consumed by deploy/k8s/deployment.yaml:
#   BFF_REDIS_PASSWORD      -> named by cache.redis.password_env
#   BFF_JWT_HS256_SECRET    -> named by security.jwt.hs256_secret_env
#                              (unused when security.jwt.jwks_url is set)

---
# ===========================================================================
# Option A (preferred): External Secrets Operator -> AWS Secrets Manager
# ===========================================================================
# The operator reconciles the referenced AWS secret into a real Kubernetes
# Secret named `ttl-aware-bff-secrets`. Rotation in Secrets Manager propagates
# automatically after `refreshInterval`; `deployment.yaml` also carries a
# checksum annotation so a rolled value triggers a rollout.
#
# The SecretStore authenticates with the same IRSA role as the BFF
# (see deploy/terraform/modules/iam — the role's policy grants
# secretsmanager:GetSecretValue on exactly these two secret ARNs).
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: bff
  labels:
    app.kubernetes.io/name: ttl-aware-bff
    app.kubernetes.io/part-of: ttl-aware-bff
spec:
  provider:
    aws:
      service: SecretsManager
      # Replaced per environment by the kustomize overlays.
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: ttl-aware-bff

---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ttl-aware-bff-secrets
  namespace: bff
  labels:
    app.kubernetes.io/name: ttl-aware-bff
    app.kubernetes.io/part-of: ttl-aware-bff
spec:
  # Long enough not to hammer the Secrets Manager API, short enough that a
  # rotation is picked up within a deploy window.
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    # This is the Secret name deployment.yaml references in envFrom/secretKeyRef.
    name: ttl-aware-bff-secrets
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    # ElastiCache AUTH token. Terraform stores it at this path
    # (see deploy/terraform/modules/elasticache: aws_secretsmanager_secret.auth_token).
    - secretKey: BFF_REDIS_PASSWORD
      remoteRef:
        key: /bff/prod/elasticache/auth-token
        property: auth_token

    # Symmetric JWT secret, used only when the HS256 verification path is
    # enabled. Clusters using the JWKS path can drop this entry.
    - secretKey: BFF_JWT_HS256_SECRET
      remoteRef:
        key: /bff/prod/jwt/hs256
        property: secret

---
# ===========================================================================
# Option B: SealedSecret (Bitnami sealed-secrets)
# ===========================================================================
# Encrypted with the cluster's public key, safe to commit, decryptable only by
# the controller in that cluster:
#
#   kubectl create secret generic ttl-aware-bff-secrets -n bff \
#     --dry-run=client -o yaml \
#     --from-literal=BFF_REDIS_PASSWORD='...' \
#     --from-literal=BFF_JWT_HS256_SECRET='...' \
#   | kubeseal --controller-namespace kube-system --format yaml \
#   > deploy/k8s/secret.sealed.yaml
#
# The ciphertext below is a syntactically valid placeholder, not a real
# encrypted value; regenerate with the command above before applying.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ttl-aware-bff-secrets
  namespace: bff
  labels:
    app.kubernetes.io/name: ttl-aware-bff
    app.kubernetes.io/part-of: ttl-aware-bff
spec:
  encryptedData:
    BFF_REDIS_PASSWORD: AgBvREPLACE_WITH_KUBESEAL_OUTPUT_FOR_REDIS_PASSWORD
    BFF_JWT_HS256_SECRET: AgBvREPLACE_WITH_KUBESEAL_OUTPUT_FOR_JWT_HS256_SECRET
  template:
    metadata:
      name: ttl-aware-bff-secrets
      namespace: bff
    type: Opaque
